/* ================================================================
 * OralScanAPI — single data boundary for the app.
 * Set OralScanAPI.config.mock=false and baseURL to use a real YOLOv8 backend.
 * Expected backend contract:
 *   POST {baseURL}/v1/analyze  (multipart "images")      -> { id }
 *   GET  {baseURL}/v1/jobs/:id                           -> { status:'running'|'done'|'error',
 *          stages:[{id:'M1'..'M5',status,progress,ms}],
 *          result:{ risk, image:{width,height},
 *                   detections:[{class_name,confidence,fdi,box:{x1,y1,x2,y2}}] } }
 *   (detections follow the Ultralytics YOLOv8 results JSON; normalizeYolo() adapts them)
 * ================================================================ */
const OralScanAPI=(()=>{
 const localHost=['localhost','127.0.0.1','[::1]'].includes(location.hostname);
 const endpoint=new URLSearchParams(location.search).get('api');
 let baseURL=localHost?'http://localhost:8080':'';
 if(endpoint){try{const url=new URL(endpoint);if(url.protocol==='https:'||(localHost&&url.protocol==='http:'))baseURL=url.origin}catch(e){}}
 const config={baseURL,mock:!baseURL,timeout:30000,token:''};
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const CLASSES={caries:{label:'Caries',color:'#ef4444'},cavity:{label:'Cavity',color:'#f97316'},crack:{label:'Crack',color:'#64748b'},plaque:{label:'Plaque',color:'#f59e0b'},calculus:{label:'Calculus',color:'#8b5cf6'},gingivitis:{label:'Gingivitis',color:'#ec4899'},tooth_discoloration:{label:'Discoloration',color:'#eab308'},tooth_discolation:{label:'Discoloration',color:'#eab308'},hypodontia:{label:'Hypodontia',color:'#0ea5e9'},ulcer:{label:'Ulcer',color:'#14b8a6'}};
 const STAGES=[
  {id:'M1',t:'Image quality gate',s:'Blur, exposure and coverage check'},
  {id:'M2',t:'Tooth segmentation',s:'Locate each tooth region'},
  {id:'M3',t:'Lesion detection · YOLOv8',s:'Caries, plaque, calculus, gingivitis'},
  {id:'M4',t:'FDI numbering',s:'Map each finding to a tooth number'},
  {id:'M5',t:'Risk scoring',s:'Aggregate findings into a risk level'}];
 async function req(path,opt={}){
  if(!config.baseURL)throw new Error('This feature requires the OralScan backend. Run the local server or connect an HTTPS API using ?api=https://your-server');
  const c=new AbortController(),t=setTimeout(()=>c.abort(),config.timeout);
  try{const r=await fetch(config.baseURL+path,{...opt,signal:c.signal,headers:{...(config.token?{Authorization:'Bearer '+config.token}:{}),...(opt.headers||{})}});
   if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
 // Ultralytics YOLOv8 JSON -> app model (normalized [x,y,w,h] boxes)
 function normalizeYolo(raw){const W=raw.image.width,H=raw.image.height;
  return raw.detections.map((d,i)=>({id:'d'+i,cls:d.class_name,conf:d.confidence,fdi:String(d.fdi??''),box:[d.box.x1/W,d.box.y1/H,(d.box.x2-d.box.x1)/W,(d.box.y2-d.box.y1)/H]}))}
 function mockDetections(){return [
  {id:'d0',cls:'plaque',conf:.87,fdi:'36',box:[.29,.52,.12,.15]},
  {id:'d1',cls:'caries',conf:.72,fdi:'46',box:[.47,.60,.11,.14]},
  {id:'d2',cls:'calculus',conf:.64,fdi:'31',box:[.38,.70,.10,.10]},
  {id:'d3',cls:'gingivitis',conf:.58,fdi:'16',box:[.33,.20,.14,.11]}]}
 async function fileBlob(im){if(im.blob)return im.blob;const r=await fetch(im.url);return r.blob()}
 async function analyze(images,{onStage}={}){
  if(!config.mock){
   const fd=new FormData();for(const [i,im] of images.entries())fd.append('images',await fileBlob(im),'scan-'+i+'.jpg');
   const job=await req('/v1/analyze',{method:'POST',body:fd});let st;
   do{await sleep(600);st=await req('/v1/jobs/'+job.id);(st.stages||[]).forEach(s=>onStage&&onStage(s));if(st.status==='error')throw new Error(st.message||'Analysis failed')}while(st.status!=='done');
   return {id:job.id,detections:normalizeYolo(st.result),risk:st.result.risk,image:images[0]&&images[0].url,source:'yolov8-local',quality:st.result.quality}}
  for(const s of STAGES){onStage&&onStage({id:s.id,status:'running',progress:0});const n=6+Math.floor(Math.random()*4),t0=performance.now();
   for(let k=1;k<=n;k++){await sleep(110+Math.random()*90);onStage&&onStage({id:s.id,status:'running',progress:k/n})}
   onStage&&onStage({id:s.id,status:'done',progress:1,ms:Math.round(performance.now()-t0)})}
  return {id:'R-'+Date.now().toString(36).toUpperCase(),detections:mockDetections(),risk:'Low',image:images[0]&&images[0].url,source:'demo',quality:{brightness:86,contrast:78,sharpness:82,score:82,estimated:true}}}
 // Client-side quality score (runs before upload so bad shots are rejected early)
 function assessQuality(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{try{
   const W=160,H=Math.max(3,Math.round(160*im.naturalHeight/im.naturalWidth)),c=document.createElement('canvas');c.width=W;c.height=H;
   const x=c.getContext('2d');x.drawImage(im,0,0,W,H);const d=x.getImageData(0,0,W,H).data,L=new Float32Array(W*H);let sum=0;
   for(let i=0;i<W*H;i++){L[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];sum+=L[i]}
   const mean=sum/L.length;let v=0;for(const l of L)v+=(l-mean)**2;const sd=Math.sqrt(v/L.length);
   let lm=0,lv=0,n=0;const q=[];for(let y=1;y<H-1;y++)for(let xx=1;xx<W-1;xx++){const i=y*W+xx,g=4*L[i]-L[i-1]-L[i+1]-L[i-W]-L[i+W];q.push(g);lm+=g;n++}
   lm/=n;for(const g of q)lv+=(g-lm)**2;lv/=n;
   const brightness=Math.round(Math.max(0,100-Math.abs(mean-140)/1.4)),contrast=Math.round(Math.min(100,sd/55*100)),sharpness=Math.round(Math.min(100,Math.sqrt(lv)/16*100));
   const score=Math.round(brightness*.3+contrast*.3+sharpness*.4);res({brightness,contrast,sharpness,score,pass:score>=60})
  }catch(e){res({brightness:86,contrast:78,sharpness:82,score:82,pass:true,estimated:true})}};im.onerror=rej;im.src=url})}
 return {config,CLASSES,STAGES,normalizeYolo,mockDetections,analyze,assessQuality,async getHome(){return DATA},
  async submitCase(p){return req('/v1/cases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})},
  async listCases(){return req('/v1/cases')},async getCase(id){return req('/v1/cases/'+id)},
  imageDataUrl(url){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,900/im.naturalWidth);
   c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(null);im.src=url})}}
})();

const modeBadge=document.createElement('span');modeBadge.className='tag';modeBadge.textContent=API.config.mock?'Demo Mode':'AI Backend';modeBadge.title=API.config.mock?'Simulated results · Dentist review requires a backend':'Connected to '+API.config.baseURL;document.querySelector('#ttl').append(' ',modeBadge);

/* ---------------- App state ---------------- */
const ZONES=[{id:'UR',t:'Upper Right',fdi:'11–18'},{id:'UF',t:'Upper Front',fdi:'13–23'},{id:'UL',t:'Upper Left',fdi:'21–28'},{id:'LR',t:'Lower Right',fdi:'41–48'},{id:'LF',t:'Lower Front',fdi:'33–43'},{id:'LL',t:'Lower Left',fdi:'31–38'}];
const SHOTS_PER_ZONE=2;
const S={zone:'UR',shots:{},last:null,busy:false,paused:false,result:null,heat:false,hidden:{},sel:null,hover:null,jobToken:null,kid:{stage:'idle',progress:0},lastPong:0};
ZONES.forEach(z=>S.shots[z.id]=[]);
const HOOKS={};
const zone=()=>ZONES.find(z=>z.id===S.zone);
const allShots=()=>ZONES.flatMap(z=>S.shots[z.id]);
const zoneP=id=>Math.min(S.shots[id].length,SHOTS_PER_ZONE)/SHOTS_PER_ZONE;
const pct=()=>Math.round(ZONES.reduce((a,z)=>a+zoneP(z.id),0)/ZONES.length*100);
const zonesDone=()=>ZONES.filter(z=>zoneP(z.id)>=1).length;
const qLabel=s=>s>=80?'Good':s>=60?'Fair':'Poor';
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------------- Kid Pad sync (BroadcastChannel + storage fallback) ---------------- */
const BC='BroadcastChannel' in window?new BroadcastChannel('oralscan'):null;
function send(m){try{BC&&BC.postMessage(m)}catch(e){}try{localStorage.setItem('oralscan-msg',JSON.stringify({...m,n:Math.random()}))}catch(e){}}
function kidSync(patch){S.kid={...S.kid,...(patch||{}),zone:zone().t,stars:zonesDone(),total:ZONES.length,ts:Date.now()};try{localStorage.setItem('oralscan-kid',JSON.stringify(S.kid))}catch(e){}send({type:'state',state:S.kid})}
function onMsg(m){if(!m)return;const isKid=location.hash==='#kid';
 if(isKid){if(m.type==='state')updateKid(m.state);if(m.type==='ping')send({type:'pong'})}
 else{if(m.type==='pong'||m.type==='hello'){const was=Date.now()-S.lastPong<5000;S.lastPong=Date.now();updateKidDot();if(m.type==='hello'){kidSync();if(!was)toast('Kid Pad connected')}}
  if(m.type==='kid-ready')toast('Emma is ready to start!')}}
BC&&(BC.onmessage=e=>onMsg(e.data));
addEventListener('storage',e=>{if(e.key==='oralscan-msg'&&e.newValue&&!BC)onMsg(JSON.parse(e.newValue))});
function updateKidDot(){const d=$('#kidDot');if(d)d.classList.toggle('on',Date.now()-S.lastPong<5000)}
const pingKid=()=>{if(location.hash!=='#kid'){send({type:'ping'});updateKidDot()}};setInterval(pingKid,2000);setTimeout(pingKid,300);

 if(!q)return `<div class="row between"><h2>Image Quality</h2><span class="tag gray">Waiting</span></div><p class="muted">Upload or take a photo of the current area to get a quality score.</p>`;
 const rows=[['Brightness',q.brightness],['Contrast',q.contrast],['Sharpness',q.sharpness]];
 const low=rows.slice().sort((a,b)=>a[1]-b[1])[0][0],tip={Brightness:'Add more light or face a window.',Contrast:'Move the camera tip closer to the teeth.',Sharpness:'Hold steady — the photo is blurry.'}[low];
 return `<div class="row between"><h2>Image Quality</h2><span class="tag ${q.pass?'':'warn'}">${q.pass?'Accepted':'Retake needed'}${q.estimated?' · estimated':''}</span></div>

function refreshScreening(){const p=pct();const set=(s,v)=>{const e=$(s);if(e)e.innerHTML=v};
 set('#pct',p);const b=$('#pbar');if(b)b.style.width=p+'%';set('#pmeta',`${zonesDone()} / ${ZONES.length} areas scanned · ${allShots().length} photos`);
 set('#qtag','Image quality: '+(S.last?qLabel(S.last.q.score):'—'));set('#curArea','Current Area: '+zone().t);
 const qc=$('#qcard');if(qc){qc.innerHTML=qcard();setTimeout(()=>{qc.querySelectorAll('[data-w]').forEach(i=>i.style.width=i.dataset.w+'%');qc.querySelectorAll('[data-count]').forEach(countUp)},30)}
 const z=$('#zones');if(z){z.innerHTML=zonesHTML();z.querySelectorAll('.rg').forEach(r=>{const prev=r.dataset.prev;r.style.transition='none';r.style.strokeDashoffset=r.dataset.c*(1-(S._prev?.[r.closest('[data-zone]').dataset.zone]??0));r.getBoundingClientRect();r.style.transition=''});paintRings(z)}
 S._prev=Object.fromEntries(ZONES.map(zz=>[zz.id,zoneP(zz.id)]));
 const n=allShots().length,a=$('#analyzeBtn');if(a){a.disabled=!n||S.busy;a.textContent=`Analyze ${n||''} photo${n===1?'':'s'}`}set('#aHint',n?'':'Add at least one accepted photo to analyze.');
 const t=$('#camTip');if(t&&S.last)t.innerHTML=S.last.q.pass?'Great shot!<small>Move to the next area</small>':'Move slightly closer<small>Hold steady for 2 seconds</small>';
 document.querySelectorAll('[data-pick],#sampleBtn').forEach(x=>x.disabled=S.paused||S.busy)}
async function addShot(url,blob){if(S.paused)return;S.busy=true;refreshScreening();
 const ci=$('#camImg');if(ci)ci.src=url;
 let q;try{q=await API.assessQuality(url)}catch(e){q={brightness:0,contrast:0,sharpness:0,score:0,pass:false}}
 await new Promise(r=>setTimeout(r,450));S.busy=false;const zn=zone();S.last={url,q,zone:zn.t};
 if(q.pass){S.shots[zn.id].push({url,blob,q,zone:zn.id});
  if(S.shots[zn.id].length>=SHOTS_PER_ZONE){const nx=ZONES.find(z=>zoneP(z.id)<1);if(nx){S.zone=nx.id;toast(zn.t+' complete · next: '+nx.t)}else toast('All areas scanned!')}}
 else toast('Photo rejected — please retake');
 refreshScreening();kidSync({stage:'scanning',progress:pct()/100})}
HOOKS.screening=pg=>{S._prev=Object.fromEntries(ZONES.map(z=>[z.id,zoneP(z.id)]));setTimeout(()=>paintRings(pg),250);
 ['fileUp','fileCam'].forEach(id=>pg.querySelector('#'+id).addEventListener('change',async e=>{for(const f of [...e.target.files])await addShot(URL.createObjectURL(f),f);e.target.value=''}));
 kidSync({stage:S.paused?'paused':'scanning',progress:pct()/100})};

/* ---------------- ② Analyzing (M1→M5) ---------------- */
V.analyzing=()=>{const n=allShots().length||1;return `<h1>Analyzing Scan</h1><p class="lead">Tooth Hero AI is reviewing ${n} photo${n===1?'':'s'} for Emma. This usually takes a few seconds.</p>
<section class="card lg"><div class="row between"><h2>Overall</h2><span class="big"><span id="apct">0</span>%</span></div><div class="bar"><i id="abar" style="width:0"></i></div><span class="muted" id="astat">Preparing images…</span></section>
<section class="card"><h2>Analysis Pipeline</h2><ol class="pipe">${API.STAGES.map(s=>`<li class="step" data-st="${s.id}"><span class="sdot">${s.id}</span><div class="sbody"><div class="row between"><b>${s.t}</b><span class="muted sstat">Waiting</span></div><span class="muted">${s.s}</span><div class="bar sm"><i style="width:0"></i></div></div></li>`).join('')}</ol></section>
<section class="card"><h2>Live Log</h2><pre class="log" id="alog" aria-live="polite"></pre></section>
<button class="btn sec" id="cancelA">Cancel</button>`};
HOOKS.analyzing=async pg=>{const token=S.jobToken={};const imgs=allShots().length?allShots():[{url:'assets/live-preview.png'}];const ids=API.STAGES.map(s=>s.id),seen={};
 const log=m=>{const el=pg.querySelector('#alog');if(el){el.textContent+=`[${new Date().toLocaleTimeString()}] ${m}\n`;el.scrollTop=el.scrollHeight}};
 log(`Job created · ${imgs.length} image(s) · ${API.config.mock?'mock engine':API.config.baseURL}`);kidSync({stage:'analyzing',progress:0});
 try{const res=await API.analyze(imgs,{onStage:e=>{if(S.jobToken!==token)throw new Error('cancelled');
   const li=pg.querySelector(`[data-st="${e.id}"]`);if(!li)return;const st=API.STAGES.find(s=>s.id===e.id);
   li.classList.toggle('run',e.status==='running');li.classList.toggle('done',e.status==='done');li.querySelector('.bar i').style.width=e.progress*100+'%';
   li.querySelector('.sstat').textContent=e.status==='done'?`Done · ${e.ms} ms`:`${Math.round(e.progress*100)}%`;
   if(seen[e.id]!==e.status){seen[e.id]=e.status;log(`${e.id} ${st.t} — ${e.status==='done'?'completed in '+e.ms+' ms':'started'}`);if(e.status==='running')pg.querySelector('#astat').textContent=st.t+'…'}
   const ov=Math.round((ids.indexOf(e.id)+(e.status==='done'?1:e.progress))/ids.length*100);pg.querySelector('#apct').textContent=ov;pg.querySelector('#abar').style.width=ov+'%';kidSync({stage:'analyzing',progress:ov/100})}});
  if(S.jobToken!==token)return;S.result=res;S.sel=null;S.hidden={};log(`Report ${res.id} ready · ${res.detections.length} findings · risk ${res.risk}`);
  pg.querySelector('#astat').textContent='Complete — opening report';kidSync({stage:'done',progress:1});setTimeout(()=>{if(S.jobToken===token)location.hash='report'},800)
 }catch(e){log('Stopped: '+e.message);if(e.message!=='cancelled'){toast('Analysis failed — '+e.message);const s=pg.querySelector('#astat');if(s)s.textContent='Failed: '+e.message}}};

/* ---------------- ③ Report (canvas detections + heatmap) ---------------- */
const cur=()=>S.result||{id:'SAMPLE',detections:API.mockDetections(),image:'assets/live-preview.png',risk:'Low',sample:true};
const cnt=k=>cur().detections.filter(d=>d.cls===k).length;
V.report=()=>{const r=cur();return `<h1>Detailed Report</h1><p class="lead">Review Emma’s attention areas and follow-up suggestions.</p>
<section class="card lg"><div class="row between wrap"><h2>Detection View</h2><div class="seg" role="tablist" aria-label="Overlay mode"><button role="tab" data-view="box" aria-selected="${!S.heat}">Boxes</button><button role="tab" data-view="heat" aria-selected="${S.heat}">Heatmap</button></div></div>
<div class="viewer" id="viewer"><img id="rimg" src="${r.image}" alt="Screening photo with detected areas" onerror="this.parentNode.classList.add('img-failed')"><canvas id="rcv" aria-hidden="true"></canvas></div>
<div class="row wrap" style="gap:6px">${Object.entries(C).map(([k,c])=>`<button class="tag fchip" data-cls="${k}" aria-pressed="${!S.hidden[k]}" style="--cc:${c.color}"><i></i>${c.label} · ${cnt(k)}</button>`).join('')}</div>
${r.sample?'<span class="muted">Sample result — run a screening to see Emma’s own photos.</span>':`<span class="muted">Report ${r.id}</span>`}</section>

<section class="card lg"><h2>Report Overview</h2><div class="row between wrap"><div><span class="muted">Selected Area</span><h3 id="selArea">Lower Molars</h3><span class="muted">Screening indication only</span></div><div class="row" style="gap:6px"><span class="tag">Risk: ${r.risk}</span><span class="tag">Quality: Good</span></div></div></section>
<section class="card"><h2>Tooth Area Detail</h2>${teeth(true)}${legend(true)}</section>
<section class="card"><h2>AI Evidence Chain</h2><div class="row wrap" style="gap:6px">${r.source==='demo'?'<span class="tag warn">Source: Demo Mode · simulated data</span>':'<span class="tag">Source: YOLOv8 local model</span>'}<span class="tag blue">Report ${r.id}</span><span class="tag">Risk: ${r.risk}</span></div><p class="muted" style="margin-top:8px">The original photo and raw model output are archived with the case record. Dentist revisions are stored separately — AI output is never overwritten.</p></section>
<section class="card"><h2>What this means</h2><p class="muted">Back teeth are harder for children to clean. Guide Emma to brush this area more carefully.</p></section>

<div class="bottom"><button class="btn sec" style="width:auto" ${go('summary')}>Back</button><button class="btn" data-talk>Talk to a Dentist</button></div>`};
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function drawReport(k=1){const img=$('#rimg'),cv=$('#rcv');if(!img||!cv||!img.naturalWidth)return;
 const W=img.clientWidth,H=img.clientHeight,dpr=devicePixelRatio||1;if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px'}
 const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
 const dets=cur().detections.filter(d=>!S.hidden[d.cls]),hl=S.hover||S.sel;
 if(S.heat){x.fillStyle='rgba(17,24,39,.18)';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';
  dets.forEach(d=>{const [bx,by,bw,bh]=d.box,cx=(bx+bw/2)*W,cy=(by+bh/2)*H,rad=Math.max(bw*W,bh*H)*(.9+.5*k);const g=x.createRadialGradient(cx,cy,0,cx,cy,rad);
   g.addColorStop(0,`rgba(239,68,68,${(.35+.5*d.conf)*k})`);g.addColorStop(.45,`rgba(245,158,11,${.35*d.conf*k})`);g.addColorStop(1,'rgba(59,130,246,0)');x.fillStyle=g;x.fillRect(cx-rad,cy-rad,rad*2,rad*2)});
  x.globalCompositeOperation='source-over';return}
 const placed=[];dets.forEach(d=>{const c=C[d.cls].color,[bx,by,bw,bh]=d.box,X=bx*W,Y=by*H,w=bw*W,h=bh*H,on=hl===d.id;x.globalAlpha=hl&&!on?.35:1;
  rr(x,X,Y,w,h,6);x.fillStyle=c+(on?'40':'1a');x.fill();x.setLineDash([2*(w+h)*k,2*(w+h)]);x.lineWidth=on?3:2;x.strokeStyle=c;x.stroke();x.setLineDash([]);
  if(k>.6){const t=`${d.fdi} · ${C[d.cls].label} ${Math.round(d.conf*100)}%`;x.font='600 11px Inter, system-ui, sans-serif';const tw=x.measureText(t).width+10;const lx=Math.max(2,Math.min(X,W-tw-2));const hit=y=>placed.some(p=>lx<p[0]+p[2]&&lx+tw>p[0]&&y<p[1]+17&&y+17>p[1]);let ly=Y-19;if(ly<2||hit(ly))ly=Y+h+3;let g=0;while(hit(ly)&&g++<8)ly+=18;placed.push([lx,ly,tw]);
   rr(x,lx,ly,tw,16,4);x.fillStyle=c;x.fill();x.fillStyle='#fff';x.fillText(t,lx+5,ly+12)}});x.globalAlpha=1}
function animateReport(){clearTimeout(S._anim);let i=0;const N=24;(function f(){const p=++i/N;drawReport(1-Math.pow(1-p,3));if(i<N)S._anim=setTimeout(f,25)})()}
function selectDet(id){S.sel=S.sel===id?null:id;document.querySelectorAll('.det').forEach(b=>b.setAttribute('aria-pressed',b.dataset.det===S.sel));
 const d=cur().detections.find(z=>z.id===S.sel),a=$('#selArea');if(a)a.textContent=d?`Tooth ${d.fdi} · ${C[d.cls].label}`:'Lower Molars';
 if(d){const el=document.querySelector(`[data-det="${d.id}"]`);el&&el.scrollIntoView({block:'nearest',behavior:'smooth'})}drawReport()}
function hitTest(e){const cv=$('#rcv'),r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
 return cur().detections.filter(d=>!S.hidden[d.cls]&&px>=d.box[0]&&px<=d.box[0]+d.box[2]&&py>=d.box[1]&&py<=d.box[1]+d.box[3]).sort((a,b)=>a.box[2]*a.box[3]-b.box[2]*b.box[3])[0]}
HOOKS.report=pg=>{const img=pg.querySelector('#rimg'),cv=pg.querySelector('#rcv');img.complete&&img.naturalWidth?setTimeout(animateReport,250):img.addEventListener('load',animateReport);
 let lastW=0;const ro=new ResizeObserver(en=>{const w=Math.round(en[0].contentRect.width);if(w&&w!==lastW){lastW=w;requestAnimationFrame(()=>drawReport())}});ro.observe(pg.querySelector('#viewer'));S._ro&&S._ro.disconnect();S._ro=ro;
 cv.addEventListener('click',e=>{const d=hitTest(e);if(d)selectDet(d.id)});
 cv.addEventListener('pointermove',e=>{const d=hitTest(e);cv.style.cursor=d?'pointer':'default';const id=d?d.id:null;if(id!==S.hover){S.hover=id;document.querySelectorAll('.det').forEach(b=>b.classList.toggle('hl',b.dataset.det===id));drawReport()}});
 cv.addEventListener('pointerleave',()=>{S.hover=null;document.querySelectorAll('.det').forEach(b=>b.classList.remove('hl'));drawReport()});
 pg.querySelectorAll('.det').forEach(b=>{const on=()=>{S.hover=b.dataset.det;drawReport()},off=()=>{S.hover=null;drawReport()};b.addEventListener('pointerenter',on);b.addEventListener('pointerleave',off);b.addEventListener('focus',on);b.addEventListener('blur',off)})};

/* ---------------- ⑤ Case workflow: submit → dentist review → parent view ---------------- */
function caseChip(s){return s==='reviewed'?'<span class="tag">✓ Reviewed</span>':'<span class="tag blue">⏳ Awaiting dentist</span>'}
async function submitCaseFlow(){const r=cur();toast('Submitting case…');
 try{const img=await API.imageDataUrl(r.image);
  const res=await API.submitCase({childName:'Emma',childAge:9,reportId:r.id,risk:r.risk,
   source:r.source||(API.config.mock?'demo':'yolov8-local'),quality:r.quality||null,parentNote:'',
   imageDataUrl:img,detections:r.detections.map(({cls,conf,fdi,box})=>({cls,conf,fdi,box}))});
  S.caseOpen=res.id;toast('Case '+res.id+' submitted to dentist');location.hash='cases';
 }catch(e){toast('Submit failed — '+(e.message||'server unreachable'))}}
V.cases=()=>`<h1>Case Records</h1><p class="lead">Track submitted screenings and dentist feedback.</p>
<button class="btn sec" id="caseBack" hidden style="width:auto;margin-bottom:10px">← Back to list</button>
<section class="card" id="caseBody"><p class="muted">Loading…</p></section>`;

HOOKS.cases=pg=>{const body=pg.querySelector('#caseBody'),back=pg.querySelector('#caseBack');

V.kid=()=>`<div class="kidv"><div class="hero-t">${HERO}</div><h1><span id="kmsg">Hi Hero!</span></h1><p class="lead" id="ksub">Get ready for your tooth adventure.</p>
<div class="stars" id="kstars" aria-label="Stars earned">${ZONES.map(()=>`<span class="star">${svg('star',38)}</span>`).join('')}</div>
<div class="bar kbar"><i id="kbar"></i></div><button class="btn" id="kidReady" style="max-width:280px">I’m ready!</button><p class="muted" id="klink">Waiting for parent device…</p></div>`;
function updateKid(st){if(location.hash!=='#kid'||!st)return;const M={idle:['Hi Hero!','Get ready for your tooth adventure.'],scanning:['Open wide, Hero!',`Now exploring the ${st.zone} castle`],paused:['Break time!','Take a deep breath — we’ll continue soon.'],analyzing:['Tooth Hero is on patrol…','Looking for sneaky sugar bugs'],done:['Mission complete!',`You earned ${st.stars} of ${st.total} stars. Super job!`]}[st.stage]||['Hi Hero!',''];
 $('#kmsg').textContent=M[0];$('#ksub').textContent=M[1];$('#kbar').style.width=Math.round((st.progress||0)*100)+'%';
 document.querySelectorAll('#kstars .star').forEach((s,i)=>s.classList.toggle('on',i<(st.stage==='done'?Math.max(st.stars,1):st.stars)));$('#klink').textContent='Connected to parent device'}
HOOKS.kid=()=>{send({type:'hello'});try{updateKid(JSON.parse(localStorage.getItem('oralscan-kid')))}catch(e){}};

/* ---------------- shared events ---------------- */
document.addEventListener('click',async e=>{
 const pk=e.target.closest('[data-pick]');if(pk){$('#'+pk.dataset.pick).click();return}
 if(e.target.closest('#sampleBtn')){let url='assets/live-preview.png',blob;try{blob=await (await fetch(url)).blob();url=URL.createObjectURL(blob)}catch(_){}addShot(url,blob);return}
 const zb=e.target.closest('[data-zone]');if(zb){S.zone=zb.dataset.zone;refreshScreening();kidSync();return}
 if(e.target.closest('#pause')){S.paused=!S.paused;e.target.closest('#pause').textContent=S.paused?'Resume':'Pause';refreshScreening();kidSync({stage:S.paused?'paused':'scanning'});return}
 if(e.target.closest('#analyzeBtn')){location.hash='analyzing';return}
 if(e.target.closest('#cancelA')){S.jobToken=null;kidSync({stage:'scanning'});location.hash='screening';return}
 const v=e.target.closest('[data-view]');if(v){S.heat=v.dataset.view==='heat';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',b===v));animateReport();return}
 const fc=e.target.closest('[data-cls]');if(fc){const k=fc.dataset.cls;S.hidden[k]=!S.hidden[k];fc.setAttribute('aria-pressed',!S.hidden[k]);document.querySelectorAll(`[data-cls-of="${k}"]`).forEach(b=>b.classList.toggle('off',!!S.hidden[k]));if(S.sel&&cur().detections.find(d=>d.id===S.sel).cls===k)selectDet(S.sel);drawReport();return}
 const dt=e.target.closest('[data-det]');if(dt){selectDet(dt.dataset.det);return}
 if(e.target.closest('[data-talk]')){submitCaseFlow();return}
 if(e.target.closest('#kidBtn')){window.open(location.pathname+'#kid','oralscan-kid');return}
 if(e.target.closest('#kidReady')){send({type:'kid-ready'});e.target.closest('#kidReady').textContent='Yay! Waiting for grown-up…';return}
});

const main=document.getElementById('main'),tabs=document.getElementById('tabs');
tabs.innerHTML=PAGES.map(p=>`<button class="tab" data-go="${p.id}">${svg(p.i,20)}${p.t}</button>`).join('');
function render(id){if(!V[id])id='home';main.innerHTML=`<section class="page active stg" aria-labelledby="h-${id}">${V[id]()}</section>`;
 const pg=main.firstElementChild;pg.querySelector('h1').id='h-'+id;[...pg.children].forEach((c,i)=>c.style.setProperty('--i',i));
 tabs.querySelectorAll('.tab').forEach(t=>t.dataset.go===id?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current'));
 window.scrollTo({top:0,behavior:'smooth'});if(id!=='analyzing')S.jobToken=null;document.body.classList.toggle('kid',id==='kid');HOOKS[id]&&HOOKS[id](pg);
 requestAnimationFrame(()=>setTimeout(()=>{pg.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');pg.querySelectorAll('.segs i').forEach((s,i)=>setTimeout(()=>s.classList.toggle('on',s.dataset.on==='true'),i*80));pg.querySelectorAll('[data-count]').forEach(countUp)},200));}
function countUp(el){const to=+el.dataset.count,t0=performance.now(),d=900;let fr=0;(function f(){const p=Math.min(1,Math.max((performance.now()-t0)/d,++fr/60));el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
 const l=e.target.closest('[data-load]');if(l&&!l.disabled){l.classList.add('loading');const tx=l.textContent;l.textContent='Loading…';setTimeout(()=>{l.classList.remove('loading');l.textContent=tx;location.hash=l.dataset.load;if(l.dataset.load==='connect')render('connect')},900);return}
 const r=e.target.closest('[data-rc]');if(r){const it=DATA.ready[r.dataset.rc];it.on=!it.on;r.setAttribute('aria-pressed',!!it.on);const d=DATA.ready.filter(x=>x.on).length,all=d===DATA.ready.length;document.getElementById('rcount').textContent=`${d} / ${DATA.ready.length} completed`;document.getElementById('startLive').disabled=!all;document.getElementById('rhint').textContent=all?'':'Complete all ready checks to continue.';return}
 const t=e.target.closest('[data-tooth]');if(t&&document.getElementById('selArea')){document.querySelectorAll('.tooth').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');document.getElementById('selArea').textContent=(+t.dataset.tooth<8?'Upper':'Lower')+(t.classList.contains('warn')?' Molars':' Teeth')}
});
document.addEventListener('keydown',e=>{const c=e.target.closest('[role=button][data-go]');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click()}});
addEventListener('hashchange',()=>render(location.hash.slice(1)));render(location.hash.slice(1)||'home');
</script></body></html>
